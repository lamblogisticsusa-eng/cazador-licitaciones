services:
  - type: web
    name: kyomoto
    runtime: python
    plan: starter          # <-- cambia a 'free' si quieres ahorrar USD 7/mes
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    healthCheckPath: /healthz
    envVars:
      # CRITICO: sin esto Render usa Python 3.14 y el bot no arranca.
      # Si creaste el servicio a mano y no importando este Blueprint, tienes
      # que poner la version de Python en Settings > Environment.
      - key: PYTHON_VERSION
        value: "3.12.6"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: SAM_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      # Objetivo: 10 licitaciones VIABLES al dia. Se piden 20 analisis porque
      # no todas sobreviven, y se reparten en 12 barridos de 2h para que un
      # fallo no te deje el dia entero sin nada.
      # DIAS_DE_VENTANA=10: ademas de lo nuevo, entra lo publicado durante el
      # fin de semana. Los sabados y domingos se publica muy poco, asi que con
      # una ventana de 2 dias Kyomoto se quedaria sin nada que mostrarte.
      - key: DIAS_DE_VENTANA
        value: "10"
      - key: DIAS_POR_CHUNK
        value: "3"
      # Horas que se puede servir una ventana desde la cache antes de volver a
      # pedirla a la API. Debe ser MENOR que INTERVALO_HORAS.
      - key: TTL_CACHE
        value: "1"
      - key: PRESUPUESTO_GEMINI_DIARIO
        value: "20"
      - key: PRESUPUESTO_MINIMO
        value: "10"
      - key: MAX_A_GEMINI
        value: "4"
      - key: MAX_NOTIFICACIONES
        value: "10"
      - key: PUNTAJE_MINIMO
        value: "6"
      - key: TOPE_USD
        value: "250000"
      - key: MIN_USD
        value: "5000"
      - key: MARGEN_COLCHON
        value: "0.15"
      - key: INTERVALO_HORAS
        value: "2"
      - key: WORKERS
        value: "8"
      - key: GEMINI_WORKERS
        value: "1"
      - key: GEMINI_PAUSA_SEG
        value: "8"
      - key: DRY_RUN
        value: "0"
