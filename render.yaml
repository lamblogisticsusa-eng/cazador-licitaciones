services:
  - type: web
    name: kyomoto
    runtime: python
    plan: starter          # <-- cambia a 'free' si quieres ahorrar USD 7/mes
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    healthCheckPath: /healthz
    envVars:
      # CRITICO: sin esto Render usa Python 3.14 y el bot no arranca.
      # Si creaste el servicio a mano y no importando este Blueprint, tienes
      # que poner la version de Python en Settings > Environment.
      - key: PYTHON_VERSION
        value: "3.12.6"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: SAM_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      # Si el modelo principal responde 503 "alta demanda", Kyomoto prueba
      # estos en orden. Medido el 28-sep-2026: 3.7-flash estaba saturado
      # mientras 3.8, 3.6, flash-latest y 3.5-flash-lite respondian bien.
      - key: GEMINI_MODELES_ALTERNATIVOS
        value: "gemini-3.5-flash-lite,gemini-3.8-flash,gemini-flash-latest,gemini-3.6-flash-lite,gemini-3.7-flash"
      - key: GEMINI_ESPERA_503
        value: "20"
      # Objetivo: 10 licitaciones VIABLES al dia. Se piden 20 analisis porque
      # no todas sobreviven, y se reparten en 12 barridos de 2h para que un
      # fallo no te deje el dia entero sin nada.
      # DIAS_DE_VENTANA=10: ademas de lo nuevo, entra lo publicado durante el
      # fin de semana. Los sabados y domingos se publica muy poco, asi que con
      # una ventana de 2 dias Kyomoto se quedaria sin nada que mostrarte.
      - key: DIAS_DE_VENTANA
        value: "10"
      - key: DIAS_POR_CHUNK
        value: "3"
      # Dias de la ventana que SIEMPRE se piden a la API, porque ahi es donde
      # aparecen los avisos nuevos. El resto sale de la cache en SQLite.
      # Con 3 dias vivos y ventana de 10, son 1 peticion por barrido en vez
      # de 4: unas 12 al dia en lugar de 48.
      - key: DIAS_VIVOS
        value: "3"
      - key: PRESUPUESTO_GEMINI_DIARIO
        value: "20"
      - key: PRESUPUESTO_MINIMO
        value: "10"
      - key: MAX_A_GEMINI
        value: "4"
      - key: MAX_NOTIFICACIONES
        value: "10"
      - key: PUNTAJE_MINIMO
        value: "6"
      - key: TOPE_USD
        value: "250000"
      - key: MIN_USD
        value: "5000"
      # --- Modelo economico ---
      # El capital se resuelve con factoring en USA, asi que no se pide.
      # Lo que decide es el margen NETO despues de pagar el factoring.
      - key: FACTORING_PCT
        value: "0.035"
      - key: MARGEN_BRUTO_MIN
        value: "0.15"
      - key: MARGEN_BRUTO_MAX
        value: "0.35"
      - key: MARGEN_NETO_MIN
        value: "0.12"
      - key: INTERVALO_HORAS
        value: "2"
      - key: WORKERS
        value: "8"
      - key: GEMINI_WORKERS
        value: "1"
      - key: GEMINI_PAUSA_SEG
        value: "8"
      - key: DRY_RUN
        value: "0"
