services:
  - type: web
    name: kyomoto
    runtime: python
    plan: starter          # <-- cambia a 'free' si quieres ahorrar USD 7/mes
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: SAM_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      # Objetivo: 10 licitaciones VIABLES al dia. Se piden 20 analisis porque
      # no todas sobreviven, y se reparten en 4 barridos (4 c/u) para que un
      # fallo no te deje el dia entero sin nada.
      - key: DIAS_DE_VENTANA
        value: "2"
      - key: DIAS_POR_CHUNK
        value: "2"
      - key: PRESUPUESTO_GEMINI_DIARIO
        value: "20"
      - key: PRESUPUESTO_MINIMO
        value: "10"
      - key: MAX_A_GEMINI
        value: "4"
      - key: MAX_NOTIFICACIONES
        value: "10"
      - key: PUNTAJE_MINIMO
        value: "6"
      - key: TOPE_USD
        value: "250000"
      - key: MIN_USD
        value: "5000"
      - key: INTERVALO_HORAS
        value: "4"
      - key: WORKERS
        value: "8"
      - key: GEMINI_WORKERS
        value: "1"
      - key: GEMINI_PAUSA_SEG
        value: "8"
      - key: DRY_RUN
        value: "0"
